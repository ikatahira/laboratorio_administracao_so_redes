<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operação Núcleo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única estilo prancheta técnica sobre papel quadriculado; HUD fixo no topo com as 6 chaves da porta. */
:root{
  --paper:#EDF1F4; --grid:rgba(14,31,46,.055); --panel:#FFFFFF; --ink:#0E1F2E; --muted:#4F6376; --line:#C3CFD9;
  --accent:#F5B800; --accent-ink:#1B1500; --signal:#0A6CE0; --ok:#12805A; --bad:#C62838;
  --coat:#D6DEE6; --clad:#EAF0F5; --corefill:#FFF3C2;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1823; --grid:rgba(230,238,244,.045); --panel:#132431; --ink:#E7EEF4; --muted:#9BB0C2; --line:#27404F;
    --accent:#FFC72C; --accent-ink:#1B1500; --signal:#4CC9F0; --ok:#3DD598; --bad:#FF6B7A;
    --coat:#172B3B; --clad:#1D3447; --corefill:#3A3414;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1823; --grid:rgba(230,238,244,.045); --panel:#132431; --ink:#E7EEF4; --muted:#9BB0C2; --line:#27404F;
  --accent:#FFC72C; --accent-ink:#1B1500; --signal:#4CC9F0; --ok:#3DD598; --bad:#FF6B7A;
  --coat:#172B3B; --clad:#1D3447; --corefill:#3A3414;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.55;
}
h1,h2,h3{font-family:var(--font-display); text-transform:uppercase; letter-spacing:.02em; line-height:1; margin:0; text-wrap:balance}
p{margin:0 0 12px}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--signal); outline-offset:2px}
.wrap{max-width:880px; margin:0 auto; padding:0 16px 64px}

/* HUD */
.hud{position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:2px solid var(--ink)}
.hud-in{max-width:880px; margin:0 auto; padding:10px 16px 8px; display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center}
.who{flex:1 1 180px; min-width:0}
.who small{display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.who b{display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stat small{display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.stat b{font-family:var(--font-display); font-size:26px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.bulbs{display:flex; gap:5px; height:26px; align-items:center}
.bulb{width:18px; height:10px; border:2px solid var(--ink); border-radius:2px; background:transparent}
.bulb.on{background:var(--accent)}
.hud.hit{animation:hit .4s}
@keyframes hit{0%,100%{background:var(--paper)}30%{background:color-mix(in srgb,var(--bad) 28%,var(--paper))}}
.keys{max-width:880px; margin:0 auto; padding:0 16px 10px; display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.key{height:30px; border:2px solid var(--ink); border-radius:3px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:13px; color:var(--muted); background:transparent}
.key.got{background:var(--accent); color:var(--accent-ink); font-weight:500; font-size:17px}
.key.now{border-style:dashed; color:var(--ink)}

/* Cartões */
.card{background:var(--panel); border:2px solid var(--ink); border-radius:4px; padding:22px; margin-top:20px; box-shadow:6px 6px 0 var(--ink)}
.eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.h-xl{font-size:clamp(46px,9vw,84px); font-weight:800}
.h-l{font-size:clamp(34px,6vw,50px); font-weight:800}
.h-m{font-size:26px; font-weight:700}
.muted{color:var(--muted)}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.btn{background:var(--accent); color:var(--accent-ink); border:2px solid var(--ink); border-radius:3px; padding:11px 20px; font-weight:600; cursor:pointer; box-shadow:3px 3px 0 var(--ink); transition:transform .08s, box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none; box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:transparent; color:var(--ink)}
.input{width:100%; max-width:380px; padding:11px 12px; border:2px solid var(--ink); border-radius:3px; background:var(--paper); color:var(--ink); font:inherit}
label{font-weight:600; display:block; margin-bottom:6px}

/* Intro */
.intro{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,340px); gap:28px; align-items:center}
.intro svg{width:100%; height:auto; max-width:340px; justify-self:center}
@media (max-width:700px){.intro{grid-template-columns:1fr}}
.fiber-label{font-family:var(--font-mono); font-size:12px; fill:var(--ink)}
.halo{transform-origin:105px 150px; animation:halo 2.8s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.25; transform:scale(1)}50%{opacity:.8; transform:scale(1.35)}}
.meta{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0; padding:0; list-style:none}
.meta li{font-family:var(--font-mono); font-size:12px; border:1px solid var(--line); padding:3px 9px; border-radius:99px; color:var(--muted)}

/* Desafios */
.prompt{font-size:19px; font-weight:500; margin-bottom:16px}
.ticket{border-left:6px solid var(--accent); background:var(--paper); padding:10px 14px; margin-bottom:14px; font-family:var(--font-mono); font-size:13px}
.opts{display:grid; gap:10px}
.opt{text-align:left; padding:13px 16px; border:2px solid var(--ink); border-radius:3px; background:var(--panel); cursor:pointer; transition:background .1s}
.opt:hover:not([disabled]){background:var(--paper)}
.opt.ok{background:color-mix(in srgb,var(--ok) 22%,var(--panel)); border-color:var(--ok)}
.opt.bad{background:color-mix(in srgb,var(--bad) 16%,var(--panel)); border-color:var(--bad); text-decoration:line-through; opacity:.8}
.opt[disabled]{cursor:default}
.slots{display:grid; gap:8px; margin-bottom:16px}
.slot{display:flex; gap:10px; align-items:center; min-height:48px; padding:6px 10px; border:2px dashed var(--line); border-radius:3px}
.slot.full{border:2px solid var(--ink); background:var(--panel)}
.slot .n{font-family:var(--font-mono); font-size:13px; color:var(--muted); width:22px}
.slot button{flex:1; text-align:left; background:none; border:0; padding:6px 0; cursor:pointer}
.slot.right{border-color:var(--ok); background:color-mix(in srgb,var(--ok) 18%,var(--panel))}
.pool{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px}
.chip{padding:10px 14px; border:2px solid var(--ink); border-radius:3px; background:var(--panel); cursor:pointer; box-shadow:2px 2px 0 var(--ink)}
.chip.sel{background:var(--accent); color:var(--accent-ink)}
.chip.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.buckets{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:520px){.buckets{grid-template-columns:1fr}}
.bucket{border:2px solid var(--ink); border-radius:3px; padding:12px; min-height:130px; background:var(--paper); text-align:left; cursor:pointer}
.bucket h3{font-size:24px; margin-bottom:8px}
.bucket ul{margin:0; padding:0; list-style:none; display:grid; gap:6px}
.bucket li{font-size:14px; padding:5px 8px; background:color-mix(in srgb,var(--ok) 18%,var(--panel)); border:1px solid var(--ok); border-radius:3px}
.sim-wrap{border:2px solid var(--ink); border-radius:3px; overflow:hidden; background:var(--panel)}
#cv{display:block; width:100%; height:auto}
.sim-ctl{display:grid; gap:10px; margin:14px 0}
.sim-ctl input[type=range]{width:100%; accent-color:var(--accent-ink)}
.readout{display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 16px; font-family:var(--font-mono); font-size:14px}
.status{font-weight:600}
.status.t{color:var(--ok)}
.status.p{color:var(--bad)}
.legend{font-family:var(--font-mono); font-size:12px; color:var(--muted)}
.fb{min-height:24px; margin:14px 0 0; font-weight:500}
.fb.ok{color:var(--ok)}
.fb.no{color:var(--bad)}
.why{background:var(--paper); border-left:6px solid var(--ok); padding:10px 14px; margin-top:14px}
.hintbox{background:var(--paper); border-left:6px solid var(--signal); padding:10px 14px; margin-top:14px}
.bar{display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:20px; align-items:center}
.award{font-family:var(--font-mono); font-size:14px; color:var(--ok); font-weight:500}

/* Fase concluída e final */
.digit{font-family:var(--font-display); font-weight:800; font-size:120px; line-height:.9; background:var(--accent); color:var(--accent-ink); border:2px solid var(--ink); padding:6px 28px 0; display:inline-block; box-shadow:6px 6px 0 var(--ink)}
.medals{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; padding:0; list-style:none}
.medals li{border:2px solid var(--ink); border-radius:99px; padding:4px 14px; font-weight:600; font-size:14px; background:var(--accent); color:var(--accent-ink)}
.code{font-family:var(--font-display); font-weight:800; font-size:clamp(54px,14vw,110px); letter-spacing:.08em; color:var(--ink)}
.report{width:100%; min-height:170px; font-family:var(--font-mono); font-size:13px; padding:12px; border:2px solid var(--ink); border-radius:3px; background:var(--paper); color:var(--ink); resize:vertical}
details{margin-top:28px; border-top:1px solid var(--line); padding-top:14px}
summary{cursor:pointer; font-weight:600}
.verdict{margin-top:10px; font-weight:600}

.adm{border-left-color:var(--accent)!important}
.fig{margin:0 0 16px; border:2px solid var(--ink); border-radius:3px; background:var(--panel); overflow:hidden}
.fig img,.fig video{display:block; width:100%; max-height:340px; object-fit:contain; background:#fff}
.fig video{background:#000}
.fig figcaption{padding:8px 12px; font-family:var(--font-mono); font-size:12px; color:var(--muted); border-top:2px solid var(--ink); background:var(--paper)}
.bonus{color:var(--ok); font-weight:500; margin-left:6px}
.figs{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px}
.figs .fig{margin:0}
.opts.imgs{grid-template-columns:1fr 1fr}
@media (max-width:520px){.opts.imgs{grid-template-columns:1fr 1fr}}
.opt.withimg{display:flex; flex-direction:column; gap:8px; align-items:center; text-align:center; padding:10px}
.opt.withimg img{width:100%; height:120px; object-fit:contain; background:#fff; border-radius:2px}
.chip .thumb{display:block; width:84px; height:64px; object-fit:contain; background:#fff; margin:0 auto 6px; border-radius:2px}
.chip.hasimg{display:flex; flex-direction:column; align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

 { title:'Cofre da luz', place:'Painel de óptica',

   brief:[{src:'media/intro.mp4',poster:'media/intro.jpg',id:'intro',cap:'Vídeo da aula: abertura'},{img:'img/monomodo.jpg',cap:'Fibra monomodo e multimodo, como no slide 6'}], review:'Revise os slides 5 e 6: reflexão, refração e a luz no núcleo.',

 { title:'Rack de infra', place:'Sala de equipamentos',

 { title:'Caixa de ferramentas', place:'Oficina',

function initCur(st){
  var c={wrongs:0,hint:false,solved:false,msg:'',msgOk:false,award:null};
  if(st.type==='mcq'){
    c.opts=shuffle(st.options.map(function(o,i){return {t:(typeof o==='string'?o:o.t),img:(typeof o==='string'?null:o.img),ok:i===st.answer,bad:false};}));
  } else if(st.type==='order'){
    var idx=st.items.map(function(_,i){return i;}), pool;
    do{ pool=shuffle(idx); }while(pool.every(function(v,i){return v===i;}));
    c.pool=pool; c.seq=[]; c.right=null;
  } else if(st.type==='sort'){
    c.pool=shuffle(st.items.map(function(_,i){return i;})); c.sel=null; c.placed=[[],[]]; c.shake=null;
  } else if(st.type==='sim'){
    c.theta=st.start;
  }
  return c;
}

    body+='<p class="prompt">'+esc(st.prompt)+'</p>'+

    '</div><div>'+(c.solved?'<button class="btn" data-act="next">'+(last?'Pegar a chave':'Próximo desafio')+'</button>':'')+'</div></div>';

  app.innerHTML='<section class="card">'+head+body+fb+hintHtml+why+bar+'</section>';

    '<p class="muted">Sinal perdido nesta fase: '+S.phaseLost+'. Termine uma fase sem erros para ganhar a medalha "'+esc(ph.medal)+'".</p>';
  app.innerHTML='<section class="card"><div class="eyebrow">Fase '+(S.p+1)+' concluída · '+esc(ph.title)+'</div>'+
    '<h2 class="h-l">Chave '+(S.p+1)+' de '+PHASES.length+'</h2>'+
    '<div style="margin:20px 0"><span class="digit" aria-label="Dígito '+DIGITS[S.p]+'">'+DIGITS[S.p]+'</span></div>'+
    '<p>XP ganho nesta fase: <b>'+fmt(S.phaseXp)+'</b>. Total: <b>'+fmt(S.xp)+'</b>.</p>'+lis+
    '<div class="row" style="margin-top:20px"><button class="btn" data-act="advance">'+(S.p===PHASES.length-1?'Abrir a porta':'Próxima fase')+'</button></div></section>';
}
function renderFail(){
  app.innerHTML='<section class="card"><div class="eyebrow">Fase '+(S.p+1)+' · '+esc(PHASES[S.p].title)+'</div>'+
    '<h2 class="h-l">Sinal perdido</h2>'+
    '<p style="margin-top:16px;font-size:18px">Sua energia acabou. O XP desta fase volta ao que era e a fase recomeça. Use a revisão dos slides e as dicas.</p>'+
    '<p class="muted">'+esc(PHASES[S.p].review)+'</p>'+
    '<div class="row" style="margin-top:20px"><button class="btn" data-act="retry">Tentar de novo</button></div></section>';
}
function computeMedals(){
  var m=S.medals.slice();
  if(S.hintsTotal===0) m.push('Sem dicas');
  if(elapsedMin()<=20) m.push('Veloz');
  if(S.lostTotal===0) m.push('Impecável');
  return m;
}
function buildReport(medals){
  var code=hash6(S.name.trim().toLowerCase()+'|'+S.xp+'|'+S.lostTotal);
  return 'OPERAÇÃO NÚCLEO · Introdução a redes de fibra óptica\n'+
    'Aluno: '+S.name.trim()+'\n'+
    'Pontos: '+S.xp+'\n'+
    'Patente: '+rankFor(S.xp)+'\n'+
    'Medalhas: '+medals.length+(medals.length?' ('+medals.join(', ')+')':'')+'\n'+
    'Vidas perdidas: '+S.lostTotal+'\n'+
    'Tempo: '+elapsedMin()+' min\n'+
    'Código: '+code;
}
function renderFinal(){
  if(!S.final){ S.final={medals:computeMedals()}; S.final.report=buildReport(S.final.medals); clearSave(); }
  var f=S.final;
  app.innerHTML='<section class="card"><div class="eyebrow">Porta aberta</div>'+
    '<div class="code" aria-label="Código da porta">'+DIGITS.join('')+'</div>'+
    '<h2 class="h-l" style="margin-top:6px">Você saiu da sala</h2>'+
    '<p style="margin-top:14px;font-size:18px">Patente final: <b>'+esc(rankFor(S.xp))+'</b> com <b>'+fmt(S.xp)+' XP</b> em '+elapsedMin()+' min.</p>'+
    (f.medals.length?'<ul class="medals">'+f.medals.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul>':'<p class="muted">Nenhuma medalha desta vez. Tente de novo para buscar mais.</p>')+
    '<p style="margin-top:18px"><b>Entregue este relatório ao professor.</b> Copie o texto e envie como ele pediu.</p>'+
    '<textarea id="rp" class="report" readonly>'+esc(f.report)+'</textarea>'+
    '<div class="row" style="margin-top:12px"><button class="btn" data-act="copy">Copiar relatório</button><button class="btn ghost" data-act="again">Jogar de novo</button></div>'+
    '<p class="fb" id="cpm" role="status"></p></section>';
}
function render(){
  renderHud();
  if(view==='intro') renderIntro();
  else if(view==='brief') renderBrief();
  else if(view==='step') renderStep();
  else if(view==='done') renderDone();
  else if(view==='fail') renderFail();
  else if(view==='final') renderFinal();
  if(view!=='intro') window.scrollTo(0,0);
}

/* ---------- regras ---------- */
function wrong(msg){
  var c=S.cur;
  S.lives--; S.lostTotal++; S.phaseLost++; S.streak=0; c.wrongs++;
  c.msg=msg||'Não foi dessa vez.'; c.msgOk=false;
  flashHud();
  if(S.lives<=0){ view='fail'; }
}
function solve(base){
  var c=S.cur, pts=Math.max(40,base-30*c.wrongs-(c.hint?30:0)), combo=0;
  if(c.wrongs===0&&!c.hint){ S.streak++; if(S.streak>=2) combo=10*Math.min(S.streak-1,5); } else { S.streak=0; }
  S.xp+=pts+combo; S.phaseXp+=pts+combo;
  c.solved=true; c.award={pts:pts,combo:combo}; c.msg='Certo!'; c.msgOk=true;
}
function finishPhase(){
  var ph=PHASES[S.p];
  S.keys[S.p]=DIGITS[S.p];
  S.phaseMedal=(S.phaseLost===0);
  if(S.phaseMedal) S.medals.push(ph.medal);
  view='done';
  S.p++; persist(); S.p--;
}
function startPhase(){
  S.s=0; S.lives=3; S.phaseLost=0; S.phaseStartXp=S.xp; S.phaseXp=0; S.cur=null; S.phaseMedal=false; view='brief';
}

/* ---------- simulador ---------- */
var N1=1.48, N2=1.46, CRIT=Math.asin(N2/N1)*180/Math.PI;
function drawSim(theta){
  var cv=document.getElementById('cv'); if(!cv) return;
  var ctx=cv.getContext('2d'), W=720, H=260;
  var css=getComputedStyle(document.documentElement);
  function col(n){ return css.getPropertyValue(n).trim(); }
  ctx.setTransform(2,0,0,2,0,0); ctx.clearRect(0,0,W,H);
  ctx.fillStyle=col('--coat'); ctx.fillRect(0,0,W,H);
  ctx.fillStyle=col('--clad'); ctx.fillRect(0,56,W,148);
  ctx.fillStyle=col('--corefill'); ctx.fillRect(0,100,W,60);
  ctx.strokeStyle=col('--ink'); ctx.lineWidth=1.5; ctx.globalAlpha=.5;
  [[100],[160]].forEach(function(l){ ctx.beginPath(); ctx.moveTo(0,l[0]); ctx.lineTo(W,l[0]); ctx.stroke(); });
  ctx.globalAlpha=.75; ctx.fillStyle=col('--muted'); ctx.font='500 15px "IBM Plex Mono", monospace';
  ctx.fillText('REVESTIMENTO',W-140,28); ctx.fillText('CASCA',W-140,80); ctx.fillText('NÚCLEO',W-140,190);
  ctx.globalAlpha=1;
  var th=theta*Math.PI/180, tn=Math.tan(th), trapped=theta>=CRIT;
  var sig=col('--signal');
  ctx.lineJoin='round'; ctx.lineCap='round';
  function path(pts,w,a,glow){
    ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle=sig; ctx.lineWidth=w;
    if(glow){ ctx.shadowColor=sig; ctx.shadowBlur=10; }
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.stroke(); ctx.restore();
  }
  if(trapped){
    var x=0,y=150,dir=-1,pts=[[x,y]];
    while(x<W){
      var ty=dir<0?100:160, nx=x+Math.abs(ty-y)*tn;
      if(nx>=W){ var fr=(W-x)/(nx-x); pts.push([W,y+(ty-y)*fr]); break; }
      pts.push([nx,ty]); x=nx; y=ty; dir=-dir;
    }
    path(pts,3,1,true);
  } else {
    var xh=50*tn;
    path([[0,150],[xh,100]],3,1,true);
    var s2=Math.min(1,(N1/N2)*Math.sin(th)), t2=Math.asin(s2), dx=Math.sin(t2), dy=-Math.cos(t2);
    var k=Math.min(100/(-dy),(W-xh)/Math.max(dx,0.0001));
    path([[xh,100],[xh+dx*k,100+dy*k]],2.5,.9,true);
    var xb=xh+60*tn; if(xb<W) path([[xh,100],[xb,160]],1.5,.3,false);
    ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle=col('--ink'); ctx.globalAlpha=.6; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(xh,70); ctx.lineTo(xh,130); ctx.stroke(); ctx.restore();
  }
}
function simStatus(theta){
  var el=document.getElementById('stt'); if(!el) return;
  var t=theta>=CRIT;
  el.textContent=t?'Reflexão total: a luz fica presa':'Reflexão parcial: parte da luz escapa';
  el.className='status '+(t?'t':'p');
}

/* ---------- eventos ---------- */
app.addEventListener('input',function(e){
  if(e.target.id==='ang'&&S&&S.cur){
    S.cur.theta=Number(e.target.value);
    document.getElementById('angv').textContent=S.cur.theta;
    drawSim(S.cur.theta); simStatus(S.cur.theta);
  }
});
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  var act=b.getAttribute('data-act');
  if(act==='start'){
    var nm=document.getElementById('nm').value.trim();
    if(nm.length<2){ document.getElementById('nmerr').textContent='Digite seu nome para começar.'; document.getElementById('nm').focus(); return; }
    clearSave(); S=newState(nm); startPhase(); render(); return;
  }
  if(act==='resume'){
    var sv=loadSave(); if(!sv) return;
    S=newState(sv.name); S.p=sv.p; S.xp=sv.xp; S.lostTotal=sv.lostTotal||0; S.hintsTotal=sv.hintsTotal||0; S.restarts=sv.restarts||0;
    S.keys=sv.keys||[]; S.medals=sv.medals||[]; S.elapsed=sv.elapsed||0; S.t0=Date.now();
    startPhase(); render(); return;
  }
  if(act==='verify'){ verifyReport(); return; }
  if(!S) return;
  var c=S.cur, st=(view==='step')?PHASES[S.p].steps[S.s]:null;

  if(act==='enter'){ view='step'; S.cur=null; render(); return; }
  if(act==='retry'){ (PHASES[S.p].brief||[]).concat(PHASES[S.p].steps.map(function(t){return t.fig||{};})).forEach(function(m){ if(m.id) delete S.watched[m.id]; }); S.xp=S.phaseStartXp; S.restarts++; var keepLost=S.lostTotal; startPhase(); S.lostTotal=keepLost; view='step'; render(); return; }
  if(act==='advance'){
    S.p++;
    if(S.p>=PHASES.length){ S.p=PHASES.length-1; view='final'; render(); return; }
    startPhase(); render(); return;
  }
  if(act==='copy'){
    var m=document.getElementById('cpm'), ta=document.getElementById('rp');
    function manual(){ ta.focus(); ta.select(); m.className='fb'; m.textContent='Texto selecionado. Use Ctrl+C (ou toque e segure) para copiar.'; }
    try{
      navigator.clipboard.writeText(S.final.report).then(function(){ m.className='fb ok'; m.textContent='Relatório copiado.'; },manual);
    }catch(err){ manual(); }
    return;
  }
  if(act==='again'){ S=null; view='intro'; render(); return; }

  if(view!=='step'||!c) return;
  if(act==='hint'){ if(!c.hint){ c.hint=true; S.hintsTotal++; S.streak=0; } render(); return; }
  if(act==='next'){
    S.s++; S.cur=null;
    if(S.s>=PHASES[S.p].steps.length) finishPhase();
    render(); return;
  }
  if(c.solved) return;

  if(act==='opt'){
    var o=c.opts[Number(b.getAttribute('data-i'))];
    if(o.ok){ solve(BASE.mcq); } else { o.bad=true; wrong('Resposta errada. Tente outra opção.'); }
    render(); return;
  }
  if(act==='seq'){ c.seq.push(Number(b.getAttribute('data-v'))); c.right=null; c.msg=''; render(); return; }
  if(act==='unseq'){ c.seq.splice(Number(b.getAttribute('data-i')),1); c.right=null; c.msg=''; render(); return; }
  if(act==='check'){
    var right=c.seq.map(function(v,i){return v===i;}), n=right.filter(Boolean).length;
    if(n===st.items.length){ solve(BASE.order); }
    else { c.right=right; wrong(n+' de '+st.items.length+' etapas estão no lugar certo. As corretas ficaram em verde.'); }
    render(); return;
  }
  if(act==='pick'){ var v=Number(b.getAttribute('data-v')); c.sel=(c.sel===v)?null:v; c.msg=''; render(); return; }
  if(act==='bucket'){
    if(c.sel===null){ c.msg='Primeiro toque em um equipamento.'; c.msgOk=false; render(); return; }
    var bi=Number(b.getAttribute('data-b')), item=st.items[c.sel];
    if(item.b===bi){
      c.placed[bi].push(c.sel); c.sel=null; c.msg='';
      if(c.placed[0].length+c.placed[1].length===st.items.length) solve(BASE.sort);
    } else {
      c.shake=c.sel; c.sel=null; wrong('"'+item.t+'" não pertence a essa categoria.');
    }
    render(); return;
  }
  if(act==='simok'){
    var trapped=c.theta>=CRIT;
    if((st.goal==='trap')===trapped){ solve(BASE.sim); }
    else { wrong(st.goal==='trap'?'A luz ainda está escapando. Aumente o ângulo.':'A luz ainda está presa. Diminua o ângulo.'); }
    render(); return;
  }
});
function verifyReport(){
  var t=document.getElementById('vr').value, out=document.getElementById('vv');
  function g(re){ var m=t.match(re); return m?m[1].trim():null; }
  var nome=g(/Aluno:\s*(.+)/), xp=g(/Pontos:\s*(\d+)/), lost=g(/Vidas perdidas:\s*(\d+)/), code=g(/C[óo]digo:\s*([A-Za-z0-9]+)/);
  if(!nome||xp===null||lost===null||!code){ out.style.color='var(--bad)'; out.textContent='Não encontrei todos os campos. Cole o relatório completo.'; return; }
  var ok=hash6(nome.toLowerCase()+'|'+xp+'|'+lost)===code.toUpperCase();
  out.style.color=ok?'var(--ok)':'var(--bad)';
  out.textContent=ok?'Código confere: '+nome+', '+xp+' XP.':'Código não confere. Os dados podem ter sido alterados.';
}
function giveBonus(v){
  if(!S||(view!=='brief'&&view!=='step')) return;
  var id=v.getAttribute('data-bonus'); if(!id||S.watched[id]) return;
  if(!v.duration||v.currentTime/v.duration<0.9) return;
  S.watched[id]=true; S.xp+=50; S.phaseXp+=50;
  var el=document.getElementById('wb-'+id); if(el) el.textContent='+50 XP ganhos';
  renderHud();
}
app.addEventListener('timeupdate',function(e){ if(e.target.tagName==='VIDEO') giveBonus(e.target); },true);
app.addEventListener('ended',function(e){ if(e.target.tagName==='VIDEO'){ if(e.target.duration) giveBonus(e.target); } },true);
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='nm'){ var b=app.querySelector('[data-act="start"]'); if(b) b.click(); }
});
/* mostra o estado do simulador ao abrir a tela */
var _render=render;
render=function(){ _render(); if(view==='step'&&S&&S.cur&&S.cur.theta!==undefined) simStatus(S.cur.theta); };

render();
})();
</script>
